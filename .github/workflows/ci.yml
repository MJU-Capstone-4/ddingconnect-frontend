name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Run format check
        id: format
        run: pnpm format:check
        continue-on-error: true

      - name: Run typecheck
        id: typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Run build
        id: build
        run: pnpm build
        continue-on-error: true

      - name: PR Comment - Build Results
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-result
          message: |
            ## CI Results

            | Check | Result |
            |-------|--------|
            | Lint | ${{ steps.lint.outcome == 'success' && '👍 Pass' || '👎 Fail' }} |
            | Format | ${{ steps.format.outcome == 'success' && '👍 Pass' || '👎 Fail' }} |
            | Typecheck | ${{ steps.typecheck.outcome == 'success' && '👍 Pass' || '👎 Fail' }} |
            | Build | ${{ steps.build.outcome == 'success' && '👍 Pass' || '👎 Fail' }} |

            [View Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Discord notification
        if: github.event_name == 'pull_request' && always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.lint.outcome }}" = "success" ] && \
             [ "${{ steps.format.outcome }}" = "success" ] && \
             [ "${{ steps.typecheck.outcome }}" = "success" ] && \
             [ "${{ steps.build.outcome }}" = "success" ]; then
            STATUS="SUCCESS"
            COLOR=3066993
          else
            STATUS="FAILURE"
            COLOR=15158332
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"CI ${STATUS}\",
                \"description\": \"**PR:** ${{ github.event.pull_request.title }}\n**Author:** ${{ github.event.pull_request.user.login }}\n**Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`\",
                \"url\": \"${{ github.event.pull_request.html_url }}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Lint\", \"value\": \"${{ steps.lint.outcome }}\", \"inline\": true},
                  {\"name\": \"Format\", \"value\": \"${{ steps.format.outcome }}\", \"inline\": true},
                  {\"name\": \"Typecheck\", \"value\": \"${{ steps.typecheck.outcome }}\", \"inline\": true},
                  {\"name\": \"Build\", \"value\": \"${{ steps.build.outcome }}\", \"inline\": true}
                ]
              }]
            }" \
            $DISCORD_WEBHOOK_URL

      - name: Fail if any check failed
        if: |
          steps.lint.outcome == 'failure' ||
          steps.format.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1

  auto-assign:
    name: Auto Assign
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Assign PR author
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login]
            });

  auto-label:
    name: Auto Label
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add label from PR title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const prefixMap = {
              'feat': 'Feature',
              'fix': 'Fix',
              'init': 'Init',
              'design': 'Design',
              'chore': 'Chore',
              'refactor': 'Refactor',
              'docs': 'Docs',
            };

            const match = title.match(/^(\w+)[\s(:]/);
            if (!match) return;

            const prefix = match[1].toLowerCase();
            const label = prefixMap[prefix];
            if (!label) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
