name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Personal Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare output
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Push to deployment repository
        uses: cpina/github-action-push-to-another-repository@v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.AUTO_ACTIONS }}
        with:
          source-directory: 'output'
          destination-github-username: 'u-zzn'
          destination-repository-name: 'ddingconnect-frontend-deploy'
          user-email: ${{ secrets.EMAIL }}
          commit-message: 'Automated deploy from ${{ github.repository }}@${{ github.sha }}'
          target-branch: main

      - name: Discord notification - Deploy success
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg commit "$COMMIT_MESSAGE" \
            --arg author "$AUTHOR" \
            --arg url "$RUN_URL" \
            '{embeds:[{title:"Deploy Success",description:"**Commit:** \($commit)\n**Author:** \($author)",url:$url,color:3066993}]}' \
          | curl -sS --connect-timeout 5 --max-time 10 --retry 2 --retry-delay 1 \
            -H "Content-Type: application/json" -X POST --data @- "$DISCORD_WEBHOOK_URL"

      - name: Discord notification - Deploy failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg commit "$COMMIT_MESSAGE" \
            --arg author "$AUTHOR" \
            --arg url "$RUN_URL" \
            '{embeds:[{title:"Deploy Failed",description:"**Commit:** \($commit)\n**Author:** \($author)",url:$url,color:15158332}]}' \
          | curl -sS --connect-timeout 5 --max-time 10 --retry 2 --retry-delay 1 \
            -H "Content-Type: application/json" -X POST --data @- "$DISCORD_WEBHOOK_URL"
