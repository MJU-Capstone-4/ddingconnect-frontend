# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

rc: .lefthookrc

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,tsx,json,md,css,html,yml,yaml}'
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files} && git add {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    build:
      run: pnpm build

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
